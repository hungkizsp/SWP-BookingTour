<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>My Wishlist - TourBooking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <div id="header-container"></div>

    <div class="container my-5">
        <h2 class="mb-4">Danh sách Tour Yêu Thích</h2>
        <div id="wishlist-container" class="row g-4">
            <!-- Rendered by JS -->
        </div>
    </div>

    <script>
        const API_WISHLIST = "http://localhost:8080/api/v1/wishlist";
        
        async function loadWishlist() {
            const userStr = localStorage.getItem('user') || sessionStorage.getItem('user');
            if (!userStr) {
                window.location.href = '/user/login.html';
                return;
            }
            const user = JSON.parse(userStr);
            const container = document.getElementById('wishlist-container');
            
            try {
                const res = await fetch(`${API_WISHLIST}?userId=${user.id}&page=0&size=50`);
                const pageData = await res.json();
                
                if (pageData.content.length === 0) {
                    container.innerHTML = "<p>Bạn chưa lưu tour nào.</p>";
                    return;
                }
                
                let html = "";
                pageData.content.forEach(tour => {
                    const imageUrl = tour.images && tour.images.length > 0 ? tour.images[0].imageUrl : '/assets/images/default-tour.jpg';
                    html += `
                    <div class="col-md-4">
                        <div class="card h-100 shadow-sm position-relative">
                            <button onclick="removeFromWishlist(${tour.id}, this)" class="btn btn-light position-absolute top-0 end-0 m-2 rounded-circle" style="z-index:10; color: red;">
                                <i class="bi bi-heart-fill"></i>
                            </button>
                            <img src="${imageUrl}" class="card-img-top" alt="Tour" style="height: 200px; object-fit: cover;">
                            <div class="card-body">
                                <h5 class="card-title">${tour.tourName}</h5>
                                <p class="card-text text-primary fw-bold">${tour.price.toLocaleString()} VND</p>
                                <a href="/pages/tour-detail.html?id=${tour.id}" class="btn btn-outline-primary w-100">Xem Chi Tiết</a>
                            </div>
                        </div>
                    </div>`;
                });
                container.innerHTML = html;
            } catch (e) {
                console.error(e);
            }
        }

        async function removeFromWishlist(tourId, btnElement) {
            const userStr = localStorage.getItem('user') || sessionStorage.getItem('user');
            if (!userStr) return;
            const user = JSON.parse(userStr);
            try {
                const res = await fetch(`${API_WISHLIST}/toggle?userId=${user.id}&tourId=${tourId}`, { method: 'POST' });
                const data = await res.json();
                if (data.success && !data.isAdded) {
                    btnElement.closest('.col-md-4').remove();
                }
            } catch (e) {
                console.error(e);
            }
        }

        document.addEventListener('DOMContentLoaded', loadWishlist);
    </script>
</body>
</html>
