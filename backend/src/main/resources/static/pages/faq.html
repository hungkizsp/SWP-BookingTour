<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Câu hỏi thường gặp (FAQ) - TourBooking</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Manrope:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .faq-wrapper {
      max-width: 900px;
      margin: 120px auto 80px;
      padding: 0 5%;
    }

    .faq-title {
      font-size: 2.8rem;
      color: var(--primary-dark);
      text-align: center;
      margin-bottom: 50px;
    }

    .faq-item {
      background: white;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .faq-q {
      padding: 20px 25px;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-main);
    }

    .faq-q:hover {
      background: #fdfdfd;
    }

    .faq-a {
      padding: 0 25px;
      max-height: 0;
      overflow: hidden;
      transition: all 0.4s ease;
      color: var(--text-soft);
      line-height: 1.8;
      border-top: 1px solid transparent;
    }

    .faq-item.active .faq-a {
      padding: 20px 25px;
      max-height: 500px;
      border-top-color: var(--border);
    }

    .faq-item.active .faq-icon {
      transform: rotate(180deg);
    }

    .faq-icon {
      transition: transform 0.3s ease;
      font-size: 1.2rem;
    }
  </style>
</head>

<body>
  <div class="top-bar">
    <div class="top-info">
      <span>📞 Hotline: 0913 599 745</span>
    </div>
    <div class="top-links"><a href="./index.html">Quay lại trang chủ</a></div>
  </div>

  <div class="faq-wrapper">
    <h1 class="faq-title">Câu Hỏi Thường Gặp</h1>
    <div id="faqList">
      <div style="text-align: center; padding: 50px;">
        <div class="loader"></div> Đang tải câu hỏi...
      </div>
    </div>
  </div>

  <footer style="background: #064e3b; color: white; padding: 40px 0; text-align: center;">
    &copy; 2024 Dana. All rights reserved.
  </footer>

  <script src="../assets/js/api.js"></script>
  <script>
    async function loadFaqs() {
      try {
        const res = await TB.apiFetch('/api/v1/faqs/global');
        const faqs = res.data || res || [];

        const listEl = document.getElementById('faqList');
        if (!faqs || faqs.length === 0) {
          listEl.innerHTML = '<div style="text-align:center">Chưa có dữ liệu FAQ.</div>';
          return;
        }

        listEl.innerHTML = faqs.map(f => `
          <div class="faq-item">
            <div class="faq-q" onclick="this.parentElement.classList.toggle('active')">
              <span>${f.question}</span>
              <span class="faq-icon">▼</span>
            </div>
            <div class="faq-a">${f.answer}</div>
          </div>
        `).join('');

      } catch (err) {
        console.error(err);
        document.getElementById('faqList').innerHTML = '<div style="text-align:center; color:red;">Không thể tải dữ liệu FAQ.</div>';
      }
    }
    loadFaqs();
  </script>
</body>

</html>
