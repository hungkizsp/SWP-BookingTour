spring.application.name=booking
server.port=8080

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=TourBookingDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# HikariCP Pool Configuration
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:100}
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000

# ====================== JPA ======================
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# FORCE Hibernate to use @Column(name="...") EXACTLY
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Performance & Stability
spring.jpa.properties.hibernate.query.startup_check=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# ====================== MULTIPART UPLOAD ======================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# ====================== SPRING DATA WEB ======================
spring.data.web.pageable.page-parameter=page
spring.data.web.pageable.size-parameter=size

# ====================== JWT ======================
app.jwt.secret=${JWT_SECRET:please-change-this-secret-in-production}
app.jwt.exp-minutes=${APP_JWT_EXP_MINUTES:120}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:3000}

# ====================== MAIL (SMTP Gmail) ======================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ====================== PAYOS ======================
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payos.base-url=https://api-merchant.payos.vn
payos.return-url=http://localhost:3000/pages/payment-return.html
payos.cancel-url=http://localhost:3000/pages/checkout.html

# ====================== VNPAY ======================
vnpay.tmn-code=${VNP_TMN_CODE:}
vnpay.hash-secret=${VNP_HASH_SECRET:}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:3000/pages/client/vnpay-return.html
vnpay.version=2.1.0
vnpay.command=pay

# ====================== GEMINI ======================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent

# ====================== GOOGLE OAUTH2 ======================
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}