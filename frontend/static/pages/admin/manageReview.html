<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Reviews - TourBooking Admin</title>
    <link rel="stylesheet" href="../../assets/css/admin-common.css">
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/toast.js"></script>
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <a href="./dashboard.html" class="logo">TourBooking</a>
            <nav>
                <a href="./dashboard.html" class="nav-item">Dashboard</a>
                <a href="./manageTours.html" class="nav-item">Tours</a>
                <a href="./manageCategories.html" class="nav-item">Categories</a>
                <a href="./manageBookings.html" class="nav-item">Bookings</a>
                <a href="./manageUsers.html" class="nav-item">Users</a>
                <a href="./manageReview.html" class="nav-item active">Reviews</a>
                <a href="./manageNewsletter.html" class="nav-item">Newsletters</a>
                <a href="./financialReport.html" class="nav-item">Financial Report</a>
                <a href="./manageDiscounts.html" class="nav-item">Manage Discount</a>
                <a href="./manageVouchers.html" class="nav-item">Vouchers</a>
            </nav>
        </aside>

        <main class="main-content">
            <header>
                <h1>Reviews</h1>
                <div class="user-actions">
                    <span id="userInfo" style="font-weight: 600;"></span>
                    <button id="logoutBtn" class="btn btn-secondary" style="margin-left: 1rem;">Logout</button>
                </div>
            </header>

            <!-- Stats -->
            <div class="card" style="margin-bottom: 2rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h2>Review Statistics</h2>
                </div>
                <div class="stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1rem;">
                    <div class="stat-card" style="background: var(--bg-light); padding: 1rem; border-radius: 0.5rem; text-align: center;">
                        <small style="color: var(--text-muted); display: block; margin-bottom: 0.5rem;">Total Reviews</small>
                        <strong id="totalReviews" style="font-size: 1.5rem; color: var(--primary);">0</strong>
                    </div>
                    <div class="stat-card" style="background: var(--bg-light); padding: 1rem; border-radius: 0.5rem; text-align: center;">
                        <small style="color: var(--text-muted); display: block; margin-bottom: 0.5rem;">Avg Rating</small>
                        <strong id="avgRating" style="font-size: 1.5rem; color: var(--warning);">-</strong>
                    </div>
                    <div class="stat-card" style="background: var(--bg-light); padding: 0.5rem; border-radius: 0.5rem; text-align: center;">
                        <small style="color: var(--text-muted);">5 Stars</small>
                        <strong id="rating5" style="display: block; color: var(--success);">-</strong>
                    </div>
                    <div class="stat-card" style="background: var(--bg-light); padding: 0.5rem; border-radius: 0.5rem; text-align: center;">
                        <small style="color: var(--text-muted);">4 Stars</small>
                        <strong id="rating4" style="display: block; color: var(--primary);">-</strong>
                    </div>
                    <div class="stat-card" style="background: var(--bg-light); padding: 0.5rem; border-radius: 0.5rem; text-align: center;">
                        <small style="color: var(--text-muted);">3 Stars</small>
                        <strong id="rating3" style="display: block; color: var(--warning);">-</strong>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="card">
                <div class="filter-bar" style="display: flex; gap: 1rem; margin-bottom: 1.5rem; align-items: center; flex-wrap: wrap;">
                    <div class="form-group" style="margin-bottom: 0; min-width: 150px;">
                        <select id="ratingFilter" class="form-control" onchange="loadReviews(0)">
                            <option value="all">All Ratings</option>
                            <option value="5">5 Stars</option>
                            <option value="4">4 Stars</option>
                            <option value="3">3 Stars</option>
                            <option value="2">2 Stars</option>
                            <option value="1">1 Star</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <input type="text" id="tourFilter" class="form-control" placeholder="Search by Tour ID..." onkeyup="loadReviews(0)">
                    </div>
                    <button onclick="loadReviews()" class="btn btn-secondary">Refresh</button>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Kh&aacute;ch h&agrave;ng</th>
                                <th>Tour</th>
                                <th>Rating</th>
                                <th>N&#7897;i dung</th>
                                <th>Ng&agrave;y t&#7841;o</th>
                                <th>H&agrave;nh &#273;&#7897;ng</th>
                            </tr>
                        </thead>
                        <tbody id="reviewTable">
                            <tr>
                                <td colspan="7" style="text-align: center; padding: 2rem;">&#272;ang t&#7843;i...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- Pagination -->
                <div id="pagination" class="pagination-container"></div>
            </div>
        </main>
    </div>

    <script>
        const API = "/api/v1/reviews";

        // Auth check
        const currentUser = JSON.parse(sessionStorage.getItem('user'));
        if (!currentUser || currentUser.role !== 'ADMIN') {
            window.location.href = '/pages/auth/login.html';
        } else {
            document.getElementById('userInfo').innerText = currentUser.fullName || currentUser.FullName || currentUser.email;
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (window.TB && TB.logout) {
                TB.logout();
            } else {
                sessionStorage.removeItem('user');
                sessionStorage.removeItem('token');
                window.location.href = '/pages/auth/login.html';
            }
        });

        let currentPage = 0;
        const pageSize = 10;

        async function loadReviews(page = 0) {
            currentPage = page;
            const reviewTable = document.getElementById("reviewTable");
            reviewTable.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2rem;">&#272;ang t&#7843;i d&#7919; li&#7879;u...</td></tr>';

            const rating = document.getElementById('ratingFilter').value;
            const tourId = document.getElementById('tourFilter').value.trim();

            try {
                let url = `${API}?page=${page}&size=${pageSize}`;
                if (rating && rating !== 'all') url += `&rating=${rating}`;
                if (tourId) url += `&tourId=${tourId}`;

                const response = await TB.apiFetch(url);
                // Structure: { code, message, data: { content:[], page, totalPages, totalElements, ... } }
                const data = response.data;
                const reviews = data.content;

                if (!reviews || reviews.length === 0) {
                    reviewTable.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2rem;">Kh&#244;ng c&#243; review n&#224;o.</td></tr>';
                    updateStats(data);
                    renderPagination(0, 0);
                    return;
                }

                let html = "";
                reviews.forEach(r => {
                    // ReviewResponse fields: reviewId, userId, userName, bookingId, tourId, tourName, rating, comment, createdAt
                    const nameDisplay = r.userName || ('User #' + r.userId) || '&mdash;';
                    const tourDisplay = r.tourName
                        ? `<span style="font-size:0.8rem;color:var(--text-muted);">#${r.tourId}</span><br><strong>${escapeHtml(r.tourName)}</strong>`
                        : (r.tourId ? '#' + r.tourId : '&mdash;');

                    html += `
                        <tr>
                            <td>${r.reviewId}</td>
                            <td><strong>${escapeHtml(nameDisplay)}</strong></td>
                            <td>${tourDisplay}</td>
                            <td>${renderStars(r.rating)}</td>
                            <td style="max-width:260px;font-size:0.9rem;">${escapeHtml(r.comment || '')}</td>
                            <td style="white-space:nowrap;">${formatDate(r.createdAt)}</td>
                            <td>
                                <button class="btn btn-danger btn-sm"
                                        onclick="deleteReviewById(${r.reviewId})"
                                        style="padding:4px 10px;font-size:0.82rem;">
                                    X&#243;a
                                </button>
                            </td>
                        </tr>`;
                });
                reviewTable.innerHTML = html;
                updateStats(data);
                renderPagination(data.totalPages, data.page);

            } catch (error) {
                console.error('Error loading reviews:', error);
                reviewTable.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--danger);">L&#7895;i t&#7843;i d&#7919; li&#7879;u: ${error.message}</td></tr>`;
            }
        }

        /**
         * Render star rating using HTML entities to avoid encoding issues.
         * &#9733; = filled star (★), &#9734; = empty star (☆)
         */
        function renderStars(rating) {
            const r = Math.round(rating) || 0;
            let stars = '';
            for (let i = 1; i <= 5; i++) {
                stars += i <= r ? '&#9733;' : '&#9734;';
            }
            const colorClass = r >= 4 ? 'success' : (r >= 3 ? 'warning' : 'danger');
            return `<span class="badge badge-${colorClass}" style="letter-spacing:2px;font-size:1rem;">${stars} ${r}/5</span>`;
        }

        function updateStats(data) {
            document.getElementById('totalReviews').innerText = data.totalElements ?? 0;
            // avgRating and per-star breakdown require a separate summary API
            document.getElementById('avgRating').innerText = '&mdash;';
            document.getElementById('rating5').innerText = '&mdash;';
            document.getElementById('rating4').innerText = '&mdash;';
            document.getElementById('rating3').innerText = '&mdash;';
        }

        function renderPagination(totalPages, page) {
            const container = document.getElementById('pagination');
            if (!totalPages || totalPages <= 1) {
                container.style.display = 'none';
                container.innerHTML = '';
                return;
            }
            container.style.display = 'flex';

            let html = `<button class="page-btn" ${page === 0 ? 'disabled' : ''} onclick="loadReviews(${page - 1})">&laquo;</button>`;
            for (let i = 0; i < totalPages; i++) {
                if (i === 0 || i === totalPages - 1 || (i >= page - 2 && i <= page + 2)) {
                    html += `<button class="page-btn ${i === page ? 'active' : ''}" onclick="loadReviews(${i})">${i + 1}</button>`;
                } else if (i === page - 3 || i === page + 3) {
                    html += `<span class="page-info">...</span>`;
                }
            }
            html += `
                <button class="page-btn" ${page >= totalPages - 1 ? 'disabled' : ''} onclick="loadReviews(${page + 1})">&raquo;</button>
                <span class="page-info">Trang ${page + 1} / ${totalPages}</span>`;
            container.innerHTML = html;
        }

        async function deleteReviewById(id) {
            if (!confirm('X\u00f3a review n\u00e0y v\u0129nh vi\u1ec5n?')) return;
            try {
                await TB.apiFetch(`${API}/${id}`, { method: 'DELETE' });
                showToast('X\u00f3a review th\u00e0nh c\u00f4ng!', 'success');
                loadReviews(currentPage);
            } catch (error) {
                showToast('L\u1ed7i: ' + error.message, 'error');
            }
        }

        function formatDate(dateString) {
            if (!dateString) return '&mdash;';
            return new Date(dateString).toLocaleDateString('vi-VN');
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadReviews();
    </script>
</body>

</html>
