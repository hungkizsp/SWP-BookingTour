<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Discounts - TourBooking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/admin-common.css">
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/toast.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .panel {
            background: var(--bg-white);
            border-radius: 1.25rem;
            padding: 1.5rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .panel-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .btn-refresh {
            background: #3b82f6;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-refresh:hover {
            background: #2563eb;
        }

        header h1 {
            font-size: 1.6rem;
        }
    </style>
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <header>
                <!-- <div>
                    <h1>Quản lý Giảm giá</h1>
                    <div style="color:var(--text-muted); font-size:0.85rem; margin-top:0.5rem;">Cấu hình giảm giá cho
                        các đối tượng hành khách</div>
                </div> -->
                <div style="display:flex; align-items:center; gap:1rem;">
                    <span id="userInfo" style="font-weight:600; font-size:0.9rem;"></span>
                    <button id="logoutBtn" class="btn btn-secondary">Đăng xuất</button>
                </div>
            </header>

            <div class="panel" style="max-width: 800px; margin-top: 2rem;">
                <div class="panel-header">
                    <span class="panel-title">Quản lý tương tác tuổi</span>
                </div>
                <div id="discount-settings-container" style="font-size: 0.95rem;">
                    <p style="color:var(--text-muted)">Đang tải cấu hình...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Auth Check
        try {
            const userStr = sessionStorage.getItem('user');
            if (!userStr) { window.location.href = '/pages/auth/login.html'; throw new Error(); }
            const user = JSON.parse(userStr);
            if (!user || user.role !== 'ADMIN') { window.location.href = '/pages/auth/login.html'; throw new Error(); }
            document.getElementById('userInfo').innerText = user.fullName || user.email || 'Admin';
        } catch (e) {
            setTimeout(() => window.location.href = '/pages/auth/login.html', 1500);
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionStorage.removeItem('user');
            sessionStorage.removeItem('token');
            window.location.href = '/pages/auth/login.html';
        });

        async function loadDiscountConfigs() {
            try {
                const res = await TB.apiFetch("/api/v1/discount-policies");
                const policies = res.data || res;
                let html = '<div style="display:flex; flex-direction:column; gap:15px;">';
                policies.forEach(p => {
                    html += `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding: 15px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;">
                        <span style="font-weight:700; color: #334155;">Loại khách: ${p.passengerType}</span>
                        <div style="display:flex; align-items:center; gap:15px;">
                            <div style="display:flex; align-items:center; gap:5px;">
                                <label style="font-size:0.85rem; color:#64748b;">Tỷ lệ:</label>
                                <input type="number" step="0.01" id="rate-${p.id}" value="${p.rate}" style="width: 80px; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; font-weight:600;">
                            </div>
                            <label style="display:flex; align-items:center; gap:5px; font-size:0.9rem; font-weight:500;">
                                <input type="checkbox" id="active-${p.id}" ${p.isActive ? 'checked' : ''}> Hoạt động
                            </label>
                            <button class="btn-refresh" onclick="saveDiscountConfig(${p.id}, '${p.passengerType}')">Lưu thay đổi</button>
                        </div>
                    </div>`;
                });
                html += '</div>';
                document.getElementById('discount-settings-container').innerHTML = html;
            } catch (e) {
                document.getElementById('discount-settings-container').innerHTML = '<p style="color:red">Đang tải cấu hình: ' + e.message + '</p>';
            }
        }

        async function saveDiscountConfig(id, type) {
            const rate = parseFloat(document.getElementById(`rate-${id}`).value);
            const isActive = document.getElementById(`active-${id}`).checked;
            try {
                await TB.apiFetch(`/api/v1/discount-policies/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify({ rate, isActive })
                });
                if (typeof showToast === 'function') showToast(`Đã cập nhật cấu hình cho ${type}`, 'success');
                else alert(`Đã cập nhật cấu hình cho ${type}`);
            } catch (e) {
                if (typeof showToast === 'function') showToast(`L�i cập nhật: ${e.message}`, 'error');
                else alert(`L�i cập nhật: ${e.message}`);
            }
        }

        document.addEventListener('DOMContentLoaded', loadDiscountConfigs);
    </script>
    <script src="../../assets/js/admin/sidebar.js"></script>
</body>

</html>
