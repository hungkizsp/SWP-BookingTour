<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo cáo tài chính - Admin</title>
    <link rel="stylesheet" href="../../assets/css/admin-common.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/toast.js"></script>
    <script src="../../assets/js/financialReport.js" defer></script>
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <header>
                <h1>Báo cáo tài chính</h1>
                <div class="user-actions">
                    <span id="userInfo" style="font-weight: 600;"></span>
                    <button id="logoutBtn" class="btn btn-secondary" style="margin-left: 1rem;">Đăng xuất</button>
                </div>
            </header>

            <div class="card" style="margin-bottom: 2rem;">
                <div class="filter-row" style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-end;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Từ ngày:</label>
                        <input type="date" id="startDate" class="form-control">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Đến ngày:</label>
                        <input type="date" id="endDate" class="form-control">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Loại báo cáo</label>
                        <select id="reportType" class="form-control">
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                            <option value="monthly">Monthly</option>
                            <option value="yearly">Yearly</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Trạng thái thanh toán:</label>
                        <select id="bookingStatus" class="form-control">
                            <option value="INCLUDE_TEST" selected>Thành công</option>
                            <option value="CANCELLED">Hủy</option>
                        </select>
                    </div>
                    <button onclick="loadReport()" class="btn btn-primary"
                        style="padding: 0 25px; min-height: 48px;">Tạo báo cáo</button>

                    <div style="flex: 1;"></div>
                    <button onclick="exportToExcel()" class="btn btn-success"
                        style="padding: 0 20px; min-height: 40px;">Excel</button>
                    <button onclick="exportToPDF()" class="btn btn-danger"
                        style="padding: 0 20px; min-height: 40px;">PDF</button>
                </div>
            </div>

            <div class="stats-grid"
                style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem;">
                <div class="card" style="text-align: center; border-top: 4px solid var(--primary); padding: 2rem;">
                    <small
                        style="color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700;">Total
                        Revenue</small>
                    <h2 id="totalRevenue" style="margin: 0.5rem 0; color: var(--primary); font-size: 2rem;">0</h2>
                </div>
                <div class="card" style="text-align: center; border-top: 4px solid var(--success); padding: 2rem;">
                    <small
                        style="color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700;">Total
                        Bookings</small>
                    <h2 id="totalBookings" style="margin: 0.5rem 0; color: var(--success); font-size: 2rem;">0</h2>
                </div>
                <div class="card" style="text-align: center; border-top: 4px solid var(--warning); padding: 2rem;">
                    <small
                        style="color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700;">Avg.
                        Booking Value</small>
                    <h2 id="avgBookingValue" style="margin: 0.5rem 0; color: var(--warning); font-size: 2rem;">0</h2>
                </div>
                <div class="card" style="text-align: center; border-top: 4px solid var(--danger); padding: 2rem;">
                    <small
                        style="color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700;">Cancel
                        Rate</small>
                    <h2 id="cancelRate" style="margin: 0.5rem 0; color: var(--danger); font-size: 2rem;">0%</h2>
                </div>
            </div>

            <div class="grid" style="display: grid; grid-template-columns: 1fr; gap: 2rem; margin-bottom: 2.5rem;">
                <div class="card" style="padding: 2rem;">
                    <h3 style="margin-bottom: 1.5rem;">Revenue Trends</h3>
                    <div style="height: 350px; position: relative;">
                        <canvas id="revenueChart"></canvas>
                        <div id="chartEmptyMessage"
                            style="display: none; position: absolute; inset: 0; align-items: center; justify-content: center; color: var(--text-muted); font-size: 0.95rem; text-align: center; padding: 1rem; pointer-events: none;">
                            Chưa có dữ li�!u doanh thu thực tế trong khoảng thời gian này
                        </div>
                    </div>
                </div>
            </div>

            <div class="card" style="padding: 1.5rem;">
                <div class="table-container">
                    <table id="reportTable">
                        <thead>
                            <tr>
                                <th>Thời gian</th>
                                <th>Đặt tour</th>
                                <th>Doanh thu</th>
                                <th>Giá trị trung bình</th>
                                <th>Hủy tour</th>
                            </tr>
                        </thead>
                        <tbody id="reportBody">
                            <tr>
                                <td colspan="5" style="text-align: center; padding: 3rem; color: var(--text-muted);">
                                    Đang tải báo cáo...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../../assets/js/admin/sidebar.js"></script>
</body>

</html>
