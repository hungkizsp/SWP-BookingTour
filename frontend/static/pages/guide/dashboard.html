<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide Dashboard - TourBooking</title>
    <link rel="stylesheet" href="../../assets/css/admin-common.css">
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <header>
                <div>
                    <h1>Tour Guide</h1>
                    <div style="font-size: 0.875rem; color: var(--text-muted); margin-top: 4px;" id="guideName">
                        Loading...</div>
                </div>
                <div class="header-actions">
                    <button id="logoutBtn" class="btn btn-secondary" style="font-size:0.8rem; padding:0.4rem 0.85rem;"
                        onclick="TB.logout()">Logout</button>
                </div>
            </header>

            <div id="scheduleList"
                style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem;">
                <!-- Rendered by JS -->
            </div>
        </main>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/notification-bell.js"></script>
    <script src="/assets/js/guide/sidebar.js"></script>
    <script src="/assets/js/guide-dashboard.js"></script>
</body>

</html>
