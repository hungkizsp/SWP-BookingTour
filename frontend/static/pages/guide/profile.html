<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide Profile - TourBooking</title>
    <link rel="stylesheet" href="../../assets/css/admin-common.css">
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <header>
                <div>
                    <h1>Hồ Sơ Cá Nhân</h1>
                </div>
            </header>

            <div class="card" style="max-width: 800px; margin: 0 auto;">
                <form onsubmit="event.preventDefault(); updateGuideProfile();">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div class="form-group">
                            <label>Họ và tên</label>
                            <input type="text" id="gName" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Email (Chỉ xem)</label>
                            <input type="email" id="gEmail" class="form-control" disabled
                                style="background:var(--bg-main);">
                        </div>
                        <div class="form-group">
                            <label>Số điện thoại</label>
                            <input type="tel" id="gPhone" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Giới Tính</label>
                            <select id="gGender" class="form-control">
                                <option value="MALE">Nam</option>
                                <option value="FEMALE">Nữ</option>
                                <option value="OTHER">Khác</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Ngày sinh</label>
                            <input type="date" id="gDob" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Số năm kinh nghiệm</label>
                            <input type="number" id="gExp" min="0" class="form-control">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Địa chỉ</label>
                        <input type="text" id="gAddress" class="form-control">
                    </div>

                    <div class="form-group">
                        <label>Giới thiệu ngắn (Tiểu sử)</label>
                        <textarea id="gBio" rows="4" class="form-control"></textarea>
                    </div>

                    <div style="text-align: right; margin-top: 1.5rem;">
                        <button type="submit" class="btn btn-primary"
                            style="font-size: 1rem; padding: 0.75rem 2rem;">Cập nhật hồ sơ</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="/assets/js/guide/sidebar.js"></script>
    <script src="/assets/js/api.js"></script>
    <script>
        const $ = id => document.getElementById(id);

        async function loadProfile() {
            const user = JSON.parse(sessionStorage.getItem('user') || 'null');
            if (!user?.id || user.role !== 'GUIDE') {
                TB.goToLogin('Vui lòng đăng nhập với tài khoản Guide.');
                return;
            }
            try {
                const res = await TB.apiFetch(`/api/v1/users/${encodeURIComponent(user.id)}`);
                const u = res.data;
                $('gName').value = u.fullName || '';
                $('gEmail').value = u.email || '';
                $('gPhone').value = u.phoneNumber || '';
                $('gGender').value = u.gender || 'MALE';
                $('gDob').value = u.dateOfBirth || '';
                $('gAddress').value = u.address || '';
                $('gExp').value = u.experienceYears || '';
                $('gBio').value = u.bio || '';
            } catch (e) {
                alert("Cannot load profile");
            }
        }

        async function updateGuideProfile() {
            const user = JSON.parse(sessionStorage.getItem('user') || 'null');
            const payload = {
                fullName: $('gName').value.trim(),
                phoneNumber: $('gPhone').value.trim(),
                gender: $('gGender').value,
                dateOfBirth: $('gDob').value || null,
                address: $('gAddress').value.trim(),
                experienceYears: parseInt($('gExp').value) || null,
                bio: $('gBio').value.trim()
            };
            try {
                const res = await TB.apiFetch(`/api/v1/users/${encodeURIComponent(user.id)}`, {
                    method: 'PUT',
                    body: JSON.stringify(payload)
                });

                // Update local storage
                user.fullName = payload.fullName;
                sessionStorage.setItem('user', JSON.stringify(user));

                alert('Profile updated successfully!');
            } catch (e) {
                alert('Update failed: ' + e.message);
            }
        }

        loadProfile();
    </script>
</body>

</html>
