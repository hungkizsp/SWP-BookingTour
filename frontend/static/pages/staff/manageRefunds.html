<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Refunds - Staff</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/admin-common.css">

</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <header>
                <div>
                    <h1>Manage Refund Requests</h1>
                </div>
                <div class="header-actions">
                    <div
                        style="display:flex; align-items:center; gap:0.75rem; padding:0.25rem 0.75rem; border-radius:0.75rem; border:1px solid var(--border); cursor:pointer;">
                        <div
                            style="width:32px; height:32px; border-radius:50%; background:var(--primary-light); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.85rem;">
                            S</div>
                        <div style="display:flex; flex-direction:column; line-height:1.2;">
                            <span id="userInfo" style="font-weight:700; font-size:0.85rem;">Staff</span>
                            <span style="font-size:0.7rem; color:var(--text-muted);">Operations</span>
                        </div>
                    </div>
                    <button id="logoutBtn" class="btn btn-secondary" style="font-size:0.8rem; padding:0.4rem 0.85rem;"
                        onclick="TB.logout()">Đăng Xuất/button>
                </div>
            </header>

            <table style="width: 100%; border-collapse: collapse;" class="table-container" id="refundsTable">
                <thead>
                    <tr>
                        <th>Req ID</th>
                        <th>Booking ID</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Reason</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </main>
    </div>

    <script>
        (function () {
            var userStr = sessionStorage.getItem('user');
            if (!userStr) { window.location.href = '/pages/auth/login.html'; return; }
            var user = JSON.parse(userStr);
            if (user.role === 'ADMIN') { window.location.href = '/pages/admin/dashboard.html'; return; }
            if (user.role !== 'STAFF') { window.location.href = '/pages/auth/login.html'; return; }
            var el = document.getElementById('userInfo');
            if (el) el.innerText = user.fullName || user.email;
        })();
    </script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/notification-bell.js"></script>
    <script src="/assets/js/admin-refunds.js"></script>
    <script src="/assets/js/staff/sidebar.js"></script>
</body>

</html>
