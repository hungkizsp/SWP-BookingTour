<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quên Mật Khẩu - TourBooking</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; }
    .wrap { width:100%; max-width:460px; }
    .message { margin-top:12px; font-size:0.92em; text-align:center; }
    .muted-link { display:block; text-align:center; margin-top:14px; color:var(--primary); text-decoration:none; }
    form { display:grid; gap:12px; }
  </style>
</head>
<body>
  <div class="wrap card">
    <h2 style="text-align:center;margin-bottom:6px;">Quên Mật Khẩu</h2>
    <p style="text-align:center;color:var(--text-muted);margin-bottom:14px;">Nhập địa chỉ email của bạn, chúng tôi sẽ gửi liên kết đặt lại mật khẩu.</p>
    <form id="forgotForm">
      <div>
        <label>Email</label>
        <input type="email" id="email" required placeholder="you@example.com" />
      </div>
      <button type="submit" class="btn">Gửi Liên Kết Đặt Lại</button>
      <div id="message" class="message"></div>
    </form>
    <a class="muted-link" href="/pages/auth/login.html">Quay lại Đăng Nhập</a>
  </div>

  <script src="../../assets/js/api.js"></script>
  <script>
    const msgEl = document.getElementById('message');
    const form = document.getElementById('forgotForm');
    function setMsg(text, color) {
      msgEl.textContent = text;
      msgEl.style.color = color || '#333';
    }
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) { setMsg('Vui lòng nhập email.', 'red'); return; }
      setMsg('Đang gửi email…', '#333');
      try {
        const res = await TB.apiFetch('/api/v1/auth/forgot-password', {
          method: 'POST',
          body: JSON.stringify({ email })
        });
        // Backend returns generic success regardless of email existence
        setMsg('Nếu tài khoản tồn tại, email đặt lại mật khẩu đã được gửi.', 'green');
        form.querySelector('button[type="submit"]').disabled = true;
      } catch (err) {
        setMsg(err.message || 'Lỗi mạng, vui lòng thử lại.', 'red');
      }
    });
  </script>
</body>
</html>
