<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src * data: blob:; connect-src 'self' http://localhost:8080 ws://localhost:8080;">
  <title>Tour Đã Đặt - TourBooking</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .layout { display:grid; grid-template-columns: 240px 1fr; gap: 24px; align-items:start; margin-top: 20px; }
    .sidebar-menu { display: flex; flex-direction: column; gap: 8px; }
    .sidebar-menu a { padding: 12px 16px; border-radius: 8px; text-decoration: none; color: var(--text-base); font-weight: 600; }
    .sidebar-menu a:hover { background: rgba(0,0,0,0.05); }
    .sidebar-menu a.active { background: var(--primary); color: white; }
    
    .booking-card { border: 1px solid rgba(0,0,0,0.1); border-radius: 12px; padding: 20px; margin-bottom: 16px; position: relative; background: white; }
    .booking-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(0,0,0,0.1); padding-bottom: 12px; margin-bottom: 12px; }
    .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }
    .status-badge.success { background: #dcfce7; color: #166534; }
    .status-badge.pending { background: #fef08a; color: #854d0e; }
    .status-badge.cancelled { background: #fee2e2; color: #991b1b; }
    
    .booking-actions { display: flex; gap: 10px; margin-top: 16px; }
    
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-box { background: white; padding: 24px; border-radius: 12px; width: 100%; max-width: 500px; }
    .modal-box textarea { width: 100%; padding: 12px; border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; font-family: inherit; margin-top: 12px; }
    
    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar-menu { flex-direction: row; overflow-x: auto; }
    }
  </style>
</head>
<body style="background: #f8fafc;">
  <div class="container" style="max-width: 1200px; margin: 0 auto; padding: 20px;">
    <div class="page-shell">
        <div class="topbar" style="margin-bottom: 30px;">
          <a class="brand" href="../pages/index.html" style="text-decoration:none; display:flex; align-items:center; gap:12px;">
            <div style="background:var(--primary); color:white; width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:800;">TB</div>
            <div class="brand-copy">
              <strong style="color:var(--primary); font-size:1.2rem; display:block;">TourBooking</strong>
              <span style="font-size:0.75rem; color:var(--text-faint);">An tâm tận hưởng</span>
            </div>
          </a>
        </div>

        <div class="layout">
          <div class="card" style="background:white; padding:20px; border-radius:15px; box-shadow:0 4px 15px rgba(0,0,0,0.05);">
            <nav class="sidebar-menu">
              <a href="personal-info.html">Thông tin cá nhân</a>
              <a href="profile.html">Cập nhật hồ sơ</a>
              <a href="bookings.html" class="active">Tour đã đặt của tôi</a>
            </nav>
          </div>

          <div class="card" style="background:white; padding:30px; border-radius:15px; box-shadow:0 4px 15px rgba(0,0,0,0.05);">
            <h2 style="margin-bottom:25px; font-weight:800; color:var(--primary);">Lịch Sử Đặt Tour</h2>
            <div style="display:flex; gap:10px; margin-bottom:25px; overflow-x:auto; padding-bottom:5px;">
              <button class="btn" id="filterAll" style="background:var(--primary); color:white; min-width:80px;">Tất cả</button>
              <button class="btn btn-secondary" id="filterPending" style="min-width:100px;">Đang chờ</button>
              <button class="btn btn-secondary" id="filterDone" style="min-width:120px;">Đã hoàn thành</button>
              <button class="btn btn-secondary" id="filterCancelled" style="min-width:80px;">Đã hủy</button>
            </div>

            <div id="bookingList"></div>
          </div>
        </div>
    </div>
  </div>

  <!-- Modal Hủy Tour -->
  <div class="modal-overlay" id="cancelModal">
    <div class="modal-box">
      <h3 style="margin-top:0;">Hủy Đặt Tour</h3>
      <p style="font-size:0.9rem; color:var(--text-faint);">Bạn có chắc chắn muốn hủy đặt tour <strong id="cancelCode"></strong> không?</p>
      
      <div style="margin-top:16px; padding:12px; background:#f0f9ff; border-radius:8px; border:1px solid #bae6fd;">
        <strong>Yêu Cầu Hoàn Tiền</strong>
        <p style="font-size:0.85rem; margin:4px 0 0;">Vì bạn hủy trước 7 ngày, bạn sẽ được hoàn 100% số tiền. Vui lòng nhập tài khoản ngân hàng để nhận lại tiền.</p>
        <textarea rows="2" placeholder="Tên NH - Số TK - Chủ Tài Khoản" id="refundInfo"></textarea>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
        <button class="btn btn-secondary" onclick="closeModals()">Đóng</button>
        <button class="btn" style="background:#ef4444; color:white;" onclick="confirmCancel()">Xác nhận Hủy</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script>
    let allBookings = [];
    const $ = (id) => document.getElementById(id);

    function formatCurrency(v) {
      return Number(v || 0).toLocaleString('vi-VN') + ' ₫';
    }

    function statusBadge(status) {
      const s = String(status || '').toUpperCase();
      if (s === 'CANCELLED') return { cls: 'cancelled', label: 'Đã hủy' };
      if (s === 'COMPLETED' || s === 'SUCCESS') return { cls: 'success', label: 'Đã hoàn thành' };
      if (s === 'CONFIRMED') return { cls: 'pending', label: 'Đã xác nhận' };
      return { cls: 'pending', label: 'Đang chờ' };
    }

    function render(list) {
      const root = $('bookingList');
      if (!list || list.length === 0) {
        root.innerHTML = `<div style="text-align:center; padding:50px; color:var(--text-faint); border:1px dashed #ddd; border-radius:10px;">Chưa có tour nào trong mục này.</div>`;
        return;
      }

      root.innerHTML = list.map(b => {
        const badge = statusBadge(b.status);
        const canCancel = ['PENDING', 'CONFIRMED'].includes(String(b.status || '').toUpperCase());
        return `
          <div class="booking-card">
            <div class="booking-header">
              <div>
                <h3 style="margin:0; font-size:1.1rem; color:var(--primary);">${b.tourName || 'Tour du lịch'}</h3>
                <small style="color:var(--text-faint);">Mã đơn: #${b.id}</small>
              </div>
              <span class="status-badge ${badge.cls}">${badge.label}</span>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; font-size:0.9rem;">
              <div><strong style="color:var(--text-faint);">Ngày đặt:</strong> ${String(b.bookingDate || '').slice(0, 10)}</div>
              <div><strong style="color:var(--text-faint);">Số người:</strong> ${b.numberOfPeople || 1}</div>
              <div style="grid-column: span 2;"><strong style="color:var(--text-faint);">Tổng tiền:</strong> <span style="color:var(--price); font-weight:800; font-size:1.1rem;">${formatCurrency(b.totalPrice)}</span></div>
            </div>
            <div class="booking-actions">
              <button class="btn btn-secondary" onclick="downloadInvoice(${b.id})" style="font-size:0.8rem; height:40px;">TẢI HÓA ĐƠN</button>
              ${canCancel ? `<button class="btn" style="background:#fef2f2; color:#ef4444; border:1px solid #fee2e2; font-size:0.8rem; height:40px;" onclick="openCancelModal(${b.id})">HỦY TOUR</button>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadBookings() {
      const user = JSON.parse(sessionStorage.getItem('user') || 'null');
      if (!user?.id) { TB.goToLogin(); return; }
      const res = await TB.apiFetch('/api/v1/bookings/user/' + user.id);
      allBookings = res?.data || [];
      render(allBookings);
    }

    async function downloadInvoice(bookingId) {
      try {
        const blob = await TB.apiFetchBlob(`/api/v1/bookings/${encodeURIComponent(bookingId)}/invoice`);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `invoice_${bookingId}.pdf`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      } catch (err) {
        alert("Không tải được hóa đơn: " + err.message);
      }
    }

    let currentBooking = null;

    window.closeModals = () => { 
        $('cancelModal').style.display = 'none'; 
        $('refundInfo').value = '';
        currentBooking = null;
    };

    window.openCancelModal = (id) => { 
        currentBooking = allBookings.find(b => Number(b.id) === Number(id));
        if (currentBooking) {
            $('cancelCode').innerText = '#' + currentBooking.id;
            $('cancelModal').style.display = 'flex'; 
        }
    };

    async function confirmCancel() {
      if (!currentBooking?.id) return;
      const info = $('refundInfo').value.trim();
      const status = String(currentBooking.status || '').toUpperCase();
      const isPaid = (status === 'CONFIRMED' || status === 'SUCCESS');

      if (isPaid && !info) {
        alert("Vui lòng nhập thông tin nhận tiền hoàn (Ngân hàng - STK - Tên)!");
        return;
      }

      const btn = event.target;
      const originalText = btn.innerText;
      btn.disabled = true;
      btn.innerText = "Đang xử lý...";

      try {
        if (isPaid) {
          await TB.apiFetch(`/api/v1/bookings/${encodeURIComponent(currentBooking.id)}/refund`, {
            method: 'POST',
            body: JSON.stringify({ bookingId: currentBooking.id, reason: info })
          });
          alert("Đã gửi yêu cầu hoàn tiền thành công. Admin sẽ kiểm tra và xác nhận sớm nhất.");
        } else {
          await TB.apiFetch(`/api/v1/bookings/${encodeURIComponent(currentBooking.id)}/cancel`, { method: 'POST' });
          alert("Đã hủy đặt tour thành công.");
        }
        closeModals();
        await loadBookings();
      } catch (err) {
        console.error(err);
        alert("Có lỗi xảy ra: " + (err.message || "Vui lòng thử lại sau."));
      } finally {
        btn.disabled = false;
        btn.innerText = originalText;
      }
    }
    window.confirmCancel = confirmCancel;

    $('filterAll').onclick = () => render(allBookings);
    $('filterPending').onclick = () => render(allBookings.filter(b => ['PENDING', 'CONFIRMED'].includes(String(b.status || '').toUpperCase())));

    loadBookings().catch(console.error);
  </script>
</body>
</html>
