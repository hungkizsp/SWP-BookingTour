<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src * data: blob:; connect-src 'self' http://localhost:8080 ws://localhost:8080;">
  <title>Wishlist - TourBooking</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .layout { display: grid; grid-template-columns: 240px 1fr; gap: 24px; align-items: start; margin-top: 20px; }
    .sidebar-menu { display: flex; flex-direction: column; gap: 8px; }
    .sidebar-menu a { padding: 12px 16px; border-radius: 8px; text-decoration: none; color: var(--text-base); font-weight: 600; }
    .sidebar-menu a:hover { background: rgba(0, 0, 0, 0.05); }
    .sidebar-menu a.active { background: var(--primary); color: white; }
    .wishlist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 16px; }
    .wishlist-card { border: 1px solid rgba(0,0,0,0.08); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; background: #fff; }
    .wishlist-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
    .wishlist-img { width: 100%; height: 140px; object-fit: cover; }
    .wishlist-body { padding: 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .wishlist-title { font-weight: 700; font-size: 1rem; color: #1e293b; margin-bottom: 8px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .wishlist-price { color: var(--accent); font-weight: 800; font-size: 1.1rem; }
    .btn-remove { margin-top: 12px; width: 100%; padding: 8px; font-size: 0.85rem; font-weight: 600; background: #fee2e2; color: #991b1b; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    .btn-remove:hover { background: #fca5a5; }
    .btn-view { margin-top: 8px; width: 100%; padding: 8px; font-size: 0.85rem; font-weight: 600; background: #f1f5f9; color: #334155; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; text-align: center; text-decoration: none; display: block; }
    .btn-view:hover { background: #e2e8f0; }
    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar-menu { flex-direction: row; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-shell">
      <div class="content-pad">
        <div class="topbar">
          <a class="brand" href="../pages/index.html">
            <span class="brand-mark">TB</span>
            <span class="brand-copy">
              <strong>TourBooking</strong>
              <span>An tâm tận hưởng</span>
            </span>
          </a>
        </div>

        <div class="layout">
          <div class="card panel">
            <nav class="sidebar-menu">
              <a href="personal-info.html">Thông tin cá nhân</a>
              <a href="profile.html">Cập nhật hồ sơ</a>
              <a href="history.html">Lịch sử đặt tour</a>
              <a href="wishlist.html" class="active">WishList</a>
            </nav>
          </div>

          <div class="card panel">
            <h2 class="section-title">Tour Yêu Thích Của Bạn</h2>
            <p style="color:var(--text-faint); margin-top:-5px; margin-bottom: 20px;">Danh sách các tour bạn đã lưu.</p>

            <div id="wishlist-container" class="wishlist-grid">
              <p style="color: #666; font-size: 0.9rem;">Đang tải wishlist...</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let currentUser = null;

    async function init() {
      const userStr = sessionStorage.getItem('user');
      if (!userStr) {
        TB.goToLogin('Vui lòng đăng nhập để xem Wishlist.');
        return;
      }
      currentUser = JSON.parse(userStr);
      await loadWishlist();
    }

    async function loadWishlist() {
      const container = $('wishlist-container');
      try {
        const res = await TB.apiFetch(`/api/v1/wishlist?userId=${currentUser.id}&page=0&size=20`);
        const pageData = res.data || res;
        
        if (!pageData.content || pageData.content.length === 0) {
            container.innerHTML = "<p style='color: #666; font-size: 0.9rem; grid-column: 1/-1;'>Bạn chưa lưu tour nào trong danh sách yêu thích.</p>";
            container.style.display = 'block';
            return;
        }
        
        container.style.display = 'grid';
        let html = "";
        pageData.content.forEach(tour => {
            const imageUrl = tour.imageUrls && tour.imageUrls.length > 0 ? TB.normalizeImageUrl(tour.imageUrls[0]) : '../assets/images/default-tour.jpg';
            html += `
            <div class="wishlist-card">
                <img src="${imageUrl}" class="wishlist-img">
                <div class="wishlist-body">
                    <div>
                        <div class="wishlist-title">${tour.tourName}</div>
                        <div class="wishlist-price">${tour.price.toLocaleString('vi-VN')} đ</div>
                    </div>
                    <div>
                        <button class="btn-remove" onclick="removeWishlist(${tour.id}, this)">Bỏ thích 💔</button>
                        <a href="../pages/tour-detail.html?id=${tour.id}" class="btn-view">Xem chi tiết</a>
                    </div>
                </div>
            </div>`;
        });
        container.innerHTML = html;
      } catch(e) {
        console.error(e);
        container.innerHTML = "<p style='color: #dc2626; font-size: 0.9rem; grid-column: 1/-1;'>Lỗi tải wishlist. Vui lòng thử lại sau.</p>";
        container.style.display = 'block';
      }
    }

    async function removeWishlist(tourId, btnElement) {
      btnElement.textContent = 'Đang xử lý...';
      btnElement.disabled = true;
      try {
          const res = await TB.apiFetch(`/api/v1/wishlist/toggle?userId=${currentUser.id}&tourId=${tourId}`, { method: 'POST' });
          const data = res.data || res;
          if (data.success !== false && !data.isAdded) {
              const card = btnElement.closest('.wishlist-card');
              card.style.opacity = '0';
              setTimeout(() => {
                card.remove();
                if ($('wishlist-container').children.length === 0) {
                  $('wishlist-container').style.display = 'block';
                  $('wishlist-container').innerHTML = "<p style='color: #666; font-size: 0.9rem;'>Bạn chưa lưu tour nào trong danh sách yêu thích.</p>";
                }
              }, 300);
          }
      } catch (e) {
          console.error(e);
          alert('Lỗi bỏ thích tour: ' + e.message);
          btnElement.textContent = 'Bỏ thích 💔';
          btnElement.disabled = false;
      }
    }

    init();
  </script>
</body>
</html>
