<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Schedules - Staff</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <!-- Tailwind CDN (utilities) and Font Awesome for icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .staff-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: #082f49; color: white; padding: 2rem 1.5rem; }
        .sidebar .logo { color: white; font-size: 1.5rem; margin-bottom: 3rem; display: block; text-decoration: none; font-weight: bold; }
        .nav-item { padding: 0.75rem 1rem; color: rgba(255, 255, 255, 0.7); text-decoration: none; display: block; border-radius: 0.5rem; margin-bottom: 0.5rem; transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { background: rgba(255, 255, 255, 0.1); color: white; }
        .main-content { flex: 1; padding: 2rem 5%; background-color: #f1f5f9; overflow-y: auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        
        .data-table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .data-table th, .data-table td { padding: 1rem; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .data-table th { background: #f8fafc; font-weight: 600; color: #475569; }
        
        /* Action buttons are replaced with Tailwind utility classes in markup/JS. */

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 100; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 2rem; border-radius: 16px; width: 400px; max-width: 95%; max-height: 90vh; overflow-y: auto; }
        .modal-content h2 { margin-top: 0; margin-bottom: 1rem; }
        .modal-content select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 1rem; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    </style>
</head>

<body>
    <div class="staff-layout">
        <aside class="sidebar">
            <a href="#" class="logo"><strong>Staff</strong> Portal</a>
            <nav id="sidebarNav">
                <a href="./dashboard.html" class="nav-item">Dashboard</a>
                <a href="./manageBookings.html" class="nav-item">Manage Bookings</a>
                <a href="./manageSchedules.html" class="nav-item active">Manage Schedules</a>
                <a href="./manageRefunds.html" class="nav-item">Manage Refunds</a>
                <a href="./chat-escalations.html" class="nav-item">Chat / Escalations</a>
            </nav>
        </aside>

        <main class="main-content">
            <header>
                <h1>Manage Schedules</h1>
                <span id="userInfo" style="font-weight: 600;"></span>
            </header>

            <div class="flex gap-3 items-center mb-6">
                <input type="number" id="scheduleSearchId" placeholder="Tìm kiếm theo ID Lịch Trình" class="px-3 py-2 rounded-md border border-gray-300 w-64">
                <button onclick="searchSchedule()" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-md font-semibold">Tìm kiếm</button>
                <button onclick="resetScheduleSearch()" class="px-3 py-2 bg-slate-600 hover:bg-slate-700 text-white rounded-md font-semibold">Làm mới</button>
            </div>

            <table class="data-table" id="schedulesTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tour Name</th>
                        <th>Date</th>
                        <th>Guide ID</th>
                        <th>Status</th>
                        <th>Assign Guide</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <div id="pagination" class="pagination-container" style="margin-top:20px; display:flex; gap:5px; justify-content:center;"></div>
        </main>
    </div>

            <div class="modal" id="assignModal">
        <div class="modal-content p-6">
            <div class="flex items-start justify-between mb-4">
                <h2 class="text-lg font-semibold">Assign Tour Guide</h2>
                <button aria-label="close" onclick="closeModal()" class="text-gray-500 hover:text-gray-700 text-2xl leading-none">×</button>
            </div>

            <div class="mb-3 text-sm text-gray-600">Schedule: <span id="targetScheduleId" class="font-medium text-gray-800"></span></div>

            <label for="guideSelect" class="block text-sm font-medium text-gray-700 mb-2">Select Guide</label>
            <select id="guideSelect" class="w-full p-2 border rounded-md mb-4"></select>

            <div class="flex justify-end gap-3">
                <button class="px-4 py-2 bg-gray-400 hover:bg-gray-500 text-white rounded-md font-semibold" onclick="closeModal()">Close</button>
                <button class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-md font-semibold" onclick="submitAssignment()">Assign</button>
            </div>
        </div>
    </div>

    <!-- Progress & Photos Details Modal -->
            <div class="modal" id="detailsModal">
        <div class="modal-content w-[650px] max-w-[95%] max-h-[85vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <h2 id="detailsTitle" class="text-lg font-semibold">Tour Progress Details</h2>
                <button aria-label="close" onclick="closeDetailsModal()" class="text-gray-500 hover:text-gray-700 text-2xl leading-none">×</button>
            </div>

            <div class="mb-6">
                <h4 class="text-sm text-slate-500 mb-2">CURRENT PROGRESS</h4>
                <div id="detailsProgress" class="bg-slate-50 p-4 rounded-md border-l-4 border-emerald-600 min-h-[50px] max-h-[300px] overflow-y-auto"></div>
            </div>

            <div class="mb-6">
                <h4 class="text-sm text-slate-500 mb-2">FINAL REPORT</h4>
                <div id="detailsReport" class="bg-slate-50 p-4 rounded-md border-l-4 border-slate-500 min-h-[50px] max-h-[120px] overflow-y-auto text-sm leading-relaxed"></div>
            </div>

            <div class="mb-6">
                <h4 class="text-sm text-slate-500 mb-2">ACTIVITY PHOTOS</h4>
                <div id="detailsPhotos" class="flex gap-3 overflow-x-auto px-1 pb-4 border-b border-slate-100"></div>
            </div>

            <div class="flex justify-end">
                <button onclick="closeDetailsModal()" class="px-4 py-2 bg-slate-600 hover:bg-slate-700 text-white rounded-md font-semibold">Close</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var userStr = sessionStorage.getItem('user');
            if (!userStr) { window.location.href = '/pages/auth/login.html'; return; }
            var user = JSON.parse(userStr);
            if (user.role === 'ADMIN') { window.location.href = '/pages/admin/dashboard.html'; return; }
            if (user.role !== 'STAFF') { window.location.href = '/pages/auth/login.html'; return; }
            var el = document.getElementById('userInfo');
            if (el) el.innerText = user.fullName || user.email;
        })();
    </script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/admin-schedules.js"></script>
</body>
</html>
